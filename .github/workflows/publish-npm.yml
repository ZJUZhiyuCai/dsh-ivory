name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      confirm_version:
        description: Version in package.json to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ inputs.confirm_version }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: Verify requested version
        run: test "$(node -p "require('./package.json').version")" = "${{ inputs.confirm_version }}"
      - name: Publish with npm Trusted Publisher
        run: npm publish --access public
